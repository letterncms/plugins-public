          # About

          Tell visitors who you are, what you do and why it matters to them. Keep the first paragraph short: it is what search engines and AI assistants are most likely to quote.

          ## How we work

          Replace this with your own story. Headings like this one structure the page for readers and for the table of contents your theme can build.
