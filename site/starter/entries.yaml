  posts:
    -
      title: 'Welcome to your blog'
      slug: hello-world
      data:
        tags:
          - getting-started
        content: |-
          This is a working blog, ready for your first story. Posts use the same blocks as pages, templates and components, while the article template gives the published text a comfortable reading width.

          ## Start with something useful

          Replace this post with an answer your readers need. Keep the opening paragraph clear, then add examples, images or a list when they help explain the subject.

          - Press `/` to insert a block.
          - Drag a block by its handle to change the order.
          - Open its settings for content, design and interactions.

          > A useful page starts with a useful answer.
    -
      title: 'Reuse a component, keep one source'
      slug: reusable-content
      data:
        tags:
          - components
        content: |-
          A shared header, call to action or contact card should have one source. Components let you keep that structure in one place and use properties for the details that vary.

          ## Choose what should stay connected

          Use a component for something that should update across the site. Use a section when you want a starting point that becomes independent after insertion.

          | Reuse | What happens after insertion |
          | --- | --- |
          | Component | Instances stay connected to the source. |
          | Section | The inserted blocks become independent. |

          ## Make a deliberate change

          Edit the shared source, review the working copy, then publish. The pages that use the component rebuild with the published version.
    -
      title: 'Publish when the work is ready'
      slug: publishing-a-post
      data:
        tags:
          - publishing
        content: |-
          Saving and publishing are different steps. Saving protects the work in progress; publishing makes a reviewed version available to visitors.

          ## A simple review routine

          1. Write the opening paragraph and add a clear title.
          2. Preview the post with its article template.
          3. Check links, image descriptions and the assigned author.
          4. Publish now, or schedule an unpublished post for later.

          ## Keep improving a live post

          Edits to a published post stay in a working copy until you publish the changes. You can leave a draft incomplete and return later without changing what visitors read.

          ```json
          {"ability":"entries/publish","input":{"id":"<entry id>","expectedVersion":"<current version>"}}
          ```
